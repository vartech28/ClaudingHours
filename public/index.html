<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudingHours</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Draggable strip across the top so the user can move the window even
         though there's no native titlebar. Doubles as recovery for cases
         where the popup ends up mispositioned on a multi-monitor setup. -->
    <div id="drag-bar" data-tauri-drag-region title="Drag to move (⌘⌥R to re-center)"></div>

    <!-- ── TIMER VIEW ── -->
    <section id="timer-view" class="view active">
      <div class="session-meta">
        <input
          id="label-input"
          type="text"
          placeholder="What are you working on?"
          autocomplete="off"
          spellcheck="false"
        />
        <textarea
          id="notes-input"
          class="hidden"
          placeholder="Notes (optional)"
          rows="2"
          spellcheck="false"
        ></textarea>
        <div id="streak-badge" class="hidden"></div>
      </div>

      <div id="timer-display">00:00:00</div>

      <div id="goal-bar-wrap">
        <div id="goal-bar">
          <div id="goal-bar-fill"></div>
        </div>
        <span id="goal-label">0h 0m / 4h today</span>
      </div>

      <div class="button-row">
        <button id="btn-start">Start</button>
        <button id="btn-pause" disabled>Pause</button>
        <button id="btn-end" disabled>End</button>
      </div>

      <div class="shortcut-hint">
        <span><kbd>Space</kbd> start / pause</span>
        <span><kbd>E</kbd> end</span>
        <span><kbd>N</kbd> label</span>
        <span><kbd>⌘⌥C</kbd> open / close</span>
        <span><kbd>⌘⌥S</kbd> start / pause</span>
      </div>

      <div class="bottom-links">
        <button id="btn-overlay" class="link-btn">⛶ Fullscreen Timer</button>
        <button id="btn-log-view" class="link-btn">View Session Log →</button>
      </div>
    </section>

    <!-- ── LOG VIEW ── -->
    <section id="log-view" class="view">
      <div class="log-header">
        <div class="log-header-left">
          <h2>Session Log</h2>
          <div class="summary-pills">
            <span id="total-hours-pill" class="pill"></span>
            <span id="streak-pill" class="pill hidden"></span>
          </div>
        </div>
        <div class="log-header-right">
          <button id="btn-export-csv" class="btn-secondary">Export CSV</button>
          <button id="btn-back" class="btn-secondary">← Back</button>
        </div>
      </div>

      <div class="goal-settings">
        <!-- Display mode -->
        <div id="goal-display-row">
          <div class="goal-display-info">
            <span class="goal-settings-label">DAILY GOAL</span>
            <span id="goal-display-value">4h</span>
          </div>
          <button id="btn-edit-goal" class="btn-secondary btn-ghost">Edit</button>
        </div>
        <!-- Edit mode (hidden by default) -->
        <div id="goal-edit-row" class="hidden">
          <div class="goal-input-row">
            <span class="goal-settings-label">DAILY GOAL</span>
            <input id="goal-input" type="number" min="1" max="24" value="4" />
            <span>hours</span>
            <button id="btn-save-goal">Save</button>
            <button id="btn-cancel-goal" class="btn-ghost">Cancel</button>
          </div>
        </div>
      </div>

      <div id="weekly-chart-wrap">
        <div class="chart-header">Last 7 days</div>
        <div id="weekly-chart"></div>
      </div>

      <div class="table-wrap">
        <table id="sessions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Label</th>
              <th>Start</th>
              <th>Duration</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="empty-state" class="hidden">No sessions yet. Start your first one!</p>
      </div>
    </section>

  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
